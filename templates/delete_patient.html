{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Patient | VITACARE</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/patients.css' %}">
</head>
<body>
<div class="dashboard-container">
    {% include "partials/sidebar.html" %}

    <main class="patients-main">
        <section class="patient-details-section">
            <h2>Confirm Patient Deletion</h2>
            <p>Are you sure you want to delete {{ patient.name }} ({{ patient.patient_id }})?</p>

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="add-patient-button"
                        style="background:#dc5555;">
                    Yes, Delete
                </button>
                <a href="{% url 'patient_list' %}">Cancel</a>
            </form>
        </section>
    </main>
</div>
</body>
</html>
