{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Patient | VITACARE</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/patients.css' %}">
</head>
<body>
<div class="dashboard-container">
    {% include "partials/sidebar.html" %}

    <main class="patients-main">
        <h1>Edit Patient Details</h1>
        <section class="patient-details-section">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="add-patient-button" type="submit">Update Patient</button>
                <a href="{% url 'patient_list' %}">Cancel</a>
            </form>
        </section>
    </main>
</div>
</body>
</html>
